services:
  svm-api:
    build: .
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
